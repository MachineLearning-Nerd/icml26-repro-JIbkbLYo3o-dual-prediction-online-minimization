<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
  <rect width="900" height="430" fill="#fbfaf7"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#17212b">C6 required a proof repair, not a larger finite sweep</text>
  <text x="450" y="70" text-anchor="middle" font-family="Arial" font-size="15" fill="#52606d">General fractional set cover • deterministic algorithm • adaptive adversary</text>
  <rect x="70" y="115" width="330" height="205" rx="14" fill="#f4d8d4" stroke="#b54a3f" stroke-width="2"/>
  <text x="235" y="150" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#812b23">Printed phase order</text>
  <text x="235" y="188" text-anchor="middle" font-family="Arial" font-size="16" fill="#17212b">remove maximum-weight set</text>
  <text x="235" y="216" text-anchor="middle" font-family="Arial" font-size="16" fill="#17212b">then issue the request</text>
  <text x="215" y="260" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#812b23">H</text>
  <text x="230" y="266" text-anchor="start" font-family="Arial" font-size="16" font-weight="700" fill="#812b23">m</text>
  <text x="250" y="260" text-anchor="start" font-family="Arial" font-size="28" font-weight="700" fill="#812b23">− 1</text>
  <text x="235" y="292" text-anchor="middle" font-family="Arial" font-size="14" fill="#812b23">final increment is explicitly zero</text>
  <path d="M420 216 L480 216" stroke="#66788a" stroke-width="4"/><path d="M468 204 L482 216 L468 228" fill="none" stroke="#66788a" stroke-width="4"/>
  <rect x="500" y="115" width="330" height="205" rx="14" fill="#d9eee1" stroke="#3e8b59" stroke-width="2"/>
  <text x="665" y="150" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#24623b">Corrected phase order</text>
  <text x="665" y="188" text-anchor="middle" font-family="Arial" font-size="16" fill="#17212b">issue request on alive set</text>
  <text x="665" y="216" text-anchor="middle" font-family="Arial" font-size="16" fill="#17212b">then remove maximum weight</text>
  <text x="657" y="260" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#24623b">H</text>
  <text x="672" y="266" text-anchor="start" font-family="Arial" font-size="16" font-weight="700" fill="#24623b">m</text>
  <text x="665" y="292" text-anchor="middle" font-family="Arial" font-size="14" fill="#24623b">OPT=1; perfect dual remains noninformative</text>
  <text x="450" y="365" text-anchor="middle" font-family="Arial" font-size="16" fill="#17212b">Negative control at m=16 rejects the printed derivation with exact gap 1.</text>
  <text x="450" y="394" text-anchor="middle" font-family="Arial" font-size="14" fill="#52606d">Exact rational rows m=1…64 calibrate the implementation; induction covers every m≥1.</text>
</svg>
